[env]
TERM = "xterm-256color"

[font]
size = 13.0

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[terminal.shell]
program = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~"]

[window] 
startup_mode = "Maximized"

[keyboard]
bindings = [
    { key = "V", mods = "Control", action = "Paste" }
]
# below commands are useful to setup the "ctrl+c to copy" and remap the "ctrl+c to interrupt a program" to ctrl+shift+c
#{ key = "C", mods = "Control", action = "Copy" }, 
#{ key = "C", mods = "Control|Shift", chars = "\u0003" }
# BUT: Commented out because I recommend you to use Terminals INSIDE neovim instead (<space>fn then :terminal OR <space>ft if you're into splits)
